# ===== Datasource principal: PostgreSQL =====
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/studyquest}
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
# Geração de schema: update apenas em dev/desktop (SQLite); neon usa validate + Flyway
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.packages=com.studyquest,com.studyquest.auth,com.studyquest.flashcards,com.studyquest.gamificacao,com.studyquest.missoes,com.studyquest.nos,com.studyquest.trilhas,com.studyquest.usuarios

# ===== Datasource local: SQLite (offline-first) =====
quarkus.datasource."local".db-kind=sqlite
quarkus.datasource."local".jdbc.url=${SQLITE_URL:jdbc:sqlite:${user.home}/.studyquest/local.db}
quarkus.hibernate-orm."local".datasource=local
quarkus.hibernate-orm."local".database.generation=update
quarkus.hibernate-orm."local".packages=com.studyquest.offline
quarkus.datasource."local".jdbc.transactions=disabled

# ===== JWT =====
# Defaults para perfil dev — cada perfil sobrescreve issuer e chaves separadamente
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://studyquest.local
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
studyquest.jwt.issuer=${mp.jwt.verify.issuer}

# Desktop: chave embarcada no Electron, issuer isolado que o servidor rejeita
%desktop.mp.jwt.verify.publickey.location=publicKey.pem
%desktop.mp.jwt.verify.issuer=https://studyquest.local
%desktop.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
%desktop.studyquest.jwt.issuer=https://studyquest.local

# Neon/servidor: chave RSA separada, gerada exclusivamente para o servidor
# Em produção, defina JWT_SERVER_PRIVATE_KEY_LOCATION com o path do secret
%neon.mp.jwt.verify.publickey.location=serverPublicKey.pem
%neon.mp.jwt.verify.issuer=https://studyquest.server
%neon.smallrye.jwt.sign.key.location=${JWT_SERVER_PRIVATE_KEY_LOCATION:serverPrivateKey.pem}
%neon.studyquest.jwt.issuer=https://studyquest.server

# ===== Groq via OpenAI-compatible endpoint =====
quarkus.langchain4j.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/}
# Sem default — startup falha se GROQ_API_KEY não estiver definido em produção
quarkus.langchain4j.openai.api-key=${GROQ_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=${GROQ_MODEL:llama-3.1-8b-instant}
quarkus.langchain4j.openai.chat-model.temperature=0.7
# Dev/desktop: AI features opcionais — chave vazia desabilita sem travar o startup
%dev.quarkus.langchain4j.openai.api-key=${GROQ_API_KEY:}
%desktop.quarkus.langchain4j.openai.api-key=${GROQ_API_KEY:disabled}

# ===== CORS =====
quarkus.http.cors.enabled=true
# Sem default permissivo — CORS_ORIGINS deve ser definido explicitamente em prod.
# Perfis dev/desktop/neon sobrescrevem abaixo.
quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Authorization,Content-Type

# ===== Proxy reverso confiável (para X-Forwarded-For no rate-limit de registro) =====
# Lista de IPs de proxies confiáveis, separada por vírgulas (ex: 10.0.0.1,10.0.0.2).
# Em branco = nunca confiar em X-Forwarded-For (padrão seguro).
app.trusted-proxies=${APP_TRUSTED_PROXIES:}

# ===== E-mail (verificação de conta) =====
# Provider: auto (Resend se tiver RESEND_API_KEY, senão SMTP, senão mock) | resend | smtp | mock
studyquest.mail.provider=${MAIL_PROVIDER:auto}
mail.from=${MAIL_FROM:StudyQuest <onboarding@resend.dev>}
resend.api-key=${RESEND_API_KEY:}
quarkus.mailer.from=${MAIL_FROM:StudyQuest <onboarding@resend.dev>}
quarkus.mailer.host=${SMTP_HOST:smtp.gmail.com}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=${SMTP_STARTTLS:REQUIRED}
quarkus.mailer.login=${SMTP_LOGIN:REQUIRED}
quarkus.mailer.auth-methods=${SMTP_AUTH_METHODS:LOGIN PLAIN}
quarkus.mailer.timeout=30s
quarkus.mailer.mock=${MAIL_MOCK:false}
%dev.quarkus.mailer.mock=${MAIL_MOCK:false}
%neon.quarkus.mailer.mock=${MAIL_MOCK:false}

# ===== Judge0 REST Client =====
# Sem default — startup falha se JUDGE0_KEY não estiver definido em produção
judge0.api-key=${JUDGE0_KEY}
# auto = Judge0 se tiver chave, senão Python local | local = sempre local (dev) | judge0 = sempre Judge0
code.execution=${CODE_EXECUTION:auto}
%dev.code.execution=local
# Dev/desktop nunca chamam Judge0 (code.execution=local) — chave vazia é segura
%dev.judge0.api-key=${JUDGE0_KEY:}

quarkus.rest-client."com.studyquest.missoes.judge0.Judge0Client".url=${JUDGE0_URL:https://judge0-ce.p.rapidapi.com}
quarkus.rest-client."com.studyquest.missoes.judge0.Judge0Client".headers.X-RapidAPI-Key=${JUDGE0_KEY}
%dev.quarkus.rest-client."com.studyquest.missoes.judge0.Judge0Client".headers.X-RapidAPI-Key=${JUDGE0_KEY:}
%desktop.quarkus.rest-client."com.studyquest.missoes.judge0.Judge0Client".headers.X-RapidAPI-Key=${JUDGE0_KEY:disabled}
quarkus.rest-client."com.studyquest.missoes.judge0.Judge0Client".headers.X-RapidAPI-Host=judge0-ce.p.rapidapi.com

# ===== Perfil dev (SQLite local — rápido, sem internet) =====
%dev.quarkus.datasource.db-kind=sqlite
%dev.quarkus.datasource.jdbc.url=jdbc:sqlite:studyquest-main-dev.db
%dev.quarkus.datasource."local".jdbc.url=jdbc:sqlite:studyquest-local-dev.db?journal_mode=WAL&busy_timeout=5000
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.http.cors.origins=*
# Dev usa SQLite — POSTGRES_* não são necessárias; define placeholders para não travar startup
%dev.quarkus.datasource.username=dev
%dev.quarkus.datasource.password=dev

# ===== Perfil neon (PostgreSQL remoto — Neon) =====
# Credenciais obrigatórias: POSTGRES_URL, POSTGRES_USER, POSTGRES_PASSWORD, GROQ_API_KEY, JUDGE0_KEY
%neon.quarkus.datasource.db-kind=postgresql
%neon.quarkus.datasource.jdbc.url=${POSTGRES_URL}
%neon.quarkus.datasource.username=${POSTGRES_USER}
%neon.quarkus.datasource.password=${POSTGRES_PASSWORD}
%neon.quarkus.datasource.jdbc.max-size=5
%neon.quarkus.datasource.jdbc.min-size=1
%neon.quarkus.datasource.jdbc.acquisition-timeout=30S
# validate: Hibernate apenas verifica o schema — Flyway é a fonte de verdade
%neon.quarkus.hibernate-orm.database.generation=validate
%neon.quarkus.hibernate-orm.log.sql=false
%neon.quarkus.http.cors.origins=${CORS_ORIGINS:https://studyquest.app}
%neon.code.execution=judge0
%neon.quarkus.datasource."local".jdbc.url=jdbc:sqlite:studyquest-local-neon.db?journal_mode=WAL&busy_timeout=5000

# ===== Flyway — migrações PostgreSQL (apenas perfil neon) =====
# Flyway é a única fonte de verdade para o schema em produção.
# baseline-on-migrate: baselina o DB existente na version 0 antes de aplicar migrações pendentes.
%neon.quarkus.flyway.migrate-at-start=true
%neon.quarkus.flyway.locations=classpath:db/migrations/postgres
%neon.quarkus.flyway.baseline-on-migrate=true
%neon.quarkus.flyway.baseline-version=0

# ===== Perfil desktop (Electron — SQLite local, sem dependências externas) =====
%desktop.quarkus.package.output-directory=backend/quarkus-app
%desktop.quarkus.datasource.db-kind=sqlite
%desktop.quarkus.datasource.jdbc.url=jdbc:sqlite:${STUDYQUEST_DATA_DIR:${user.home}/.studyquest}/main.db
%desktop.quarkus.datasource."local".jdbc.url=jdbc:sqlite:${STUDYQUEST_DATA_DIR:${user.home}/.studyquest}/local.db?journal_mode=WAL&busy_timeout=5000
%desktop.quarkus.hibernate-orm.log.sql=false
%desktop.quarkus.http.cors.origins=*
%desktop.code.execution=local
%desktop.studyquest.mail.provider=${MAIL_PROVIDER:auto}
%desktop.quarkus.mailer.mock=false
%desktop.quarkus.scheduler.enabled=false
%desktop.quarkus.log.file.enable=true
%desktop.quarkus.log.file.path=${STUDYQUEST_DATA_DIR:${user.home}/.studyquest}/studyquest.log
%desktop.quarkus.log.file.level=INFO
# Desktop usa SQLite — POSTGRES_* não são necessárias; define placeholders para não travar startup
%desktop.quarkus.datasource.username=desktop
%desktop.quarkus.datasource.password=desktop
# Em desktop, auth é sempre local — sem checagem de conectividade remota
%desktop.studyquest.auth.remote=false
# Desktop não usa proxies reversos nem Neon — valores sentinela evitam SRCFG00040
%desktop.app.trusted-proxies=127.0.0.1
%desktop.judge0.api-key=disabled
%desktop.studyquest.neon.ranking.url=jdbc:postgresql://ep-small-river-ap0j5ec4-pooler.c-7.us-east-1.aws.neon.tech/studyquest?sslmode=require
%desktop.studyquest.neon.ranking.user=desktop_client
%desktop.studyquest.neon.ranking.password=senha_restrita_123
# Em neon (PostgreSQL), auth usa datasource remoto — verifica conectividade antes de operar
%neon.studyquest.auth.remote=true
