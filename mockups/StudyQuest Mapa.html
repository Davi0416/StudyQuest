<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyQuest — Mapa</title>

<!-- ============ FONTES ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />

<!-- ============ ÍCONES (Tabler Outline) ============ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />

<style>
:root{
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface-2: #1c222b;
  --border:    #30363d;
  --text:      #e6edf3;
  --text-dim:  #8b949e;
  --text-mute: #6e7681;

  --gold:  #f0c060;
  --green: #7ee787;
  --blue:  #58a6ff;
  --red:   #e06c75;

  --r-sm: 8px;
  --r-md: 10px;
  --r-lg: 12px;
  --hairline: 0.5px solid var(--border);
  --shadow-soft: 0 8px 24px -12px rgba(0,0,0,.7);
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter', system-ui, sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:flex; flex-direction:column;
}
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
i.ti{ font-size:1.15em; line-height:1; }
.serif{ font-family:'Cinzel', serif; }
.px{ font-family:'Press Start 2P', monospace; }

/* ===================================================================
   TOPBAR  (consistente com o HUB)
   =================================================================== */
.topbar{
  flex:0 0 auto;
  background:rgba(13,17,23,.82);
  backdrop-filter:blur(12px);
  border-bottom:var(--hairline);
  z-index:50;
}
.topbar-inner{
  display:flex; align-items:center; gap:28px;
  height:64px; padding:0 24px;
}
.logo{ display:flex; align-items:center; gap:10px; }
.logo-mark{
  width:34px; height:34px; display:grid; place-items:center;
  border:0.5px solid rgba(240,192,96,.5); border-radius:9px;
  background:linear-gradient(160deg, rgba(240,192,96,.16), rgba(240,192,96,.04));
  color:var(--gold); font-size:19px;
}
.logo-text{ font-family:'Cinzel', serif; font-weight:700; font-size:19px; letter-spacing:.5px; }
.logo-text b{ color:var(--gold); }
.nav{ display:flex; align-items:center; gap:4px; }
.nav a{
  display:flex; align-items:center; gap:7px;
  padding:8px 14px; border-radius:var(--r-sm);
  color:var(--text-dim); font-weight:500; font-size:14px;
  transition:color .18s, background .18s;
}
.nav a:hover{ color:var(--text); background:var(--surface); }
.nav a.active{ color:var(--gold); background:rgba(240,192,96,.07); }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:18px; }
.streak-chip{
  display:flex; align-items:center; gap:7px;
  padding:7px 12px; border-radius:999px;
  border:0.5px solid rgba(224,108,117,.35); background:rgba(224,108,117,.08);
  font-weight:600; font-size:14px;
}
.streak-chip i{ color:var(--red); font-size:17px; animation:flicker 2.4s ease-in-out infinite; }
@keyframes flicker{ 0%,100%{ transform:scale(1); opacity:1; } 45%{ transform:scale(1.12) rotate(-3deg); opacity:.85; } }
.user-block{ display:flex; align-items:center; gap:11px; }
.user-meta{ display:flex; flex-direction:column; gap:4px; min-width:120px; }
.user-meta .row1{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.user-meta .name{ font-weight:600; font-size:13px; }
.user-meta .xp-num{ font-size:11px; color:var(--text-mute); }
.xp-mini{ height:5px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.xp-mini > span{ display:block; height:100%; width:88%; background:linear-gradient(90deg,#f0c060,#ffe39b); border-radius:999px; }
.avatar{
  width:40px; height:40px; border-radius:10px; flex-shrink:0; position:relative;
  display:grid; place-items:center; font-family:'Cinzel',serif; font-weight:700; font-size:16px;
  color:#0d1117; background:linear-gradient(150deg,#f0c060,#caa244);
  border:0.5px solid rgba(240,192,96,.6);
}
.avatar .lvl{
  position:absolute; bottom:-6px; right:-6px;
  background:var(--surface-2); color:var(--gold); border:0.5px solid var(--border);
  border-radius:6px; font-family:'Inter',sans-serif; font-weight:700; font-size:10px; padding:1px 5px;
}

/* ===================================================================
   STAGE  (mapa + HUD)
   =================================================================== */
.stage{ flex:1 1 auto; display:flex; min-height:0; }

/* ---------- REGIÃO DO MAPA ---------- */
.map-region{ position:relative; flex:1 1 auto; min-width:0; overflow:hidden; background:#080a0e; }

.map-scroll{
  position:absolute; inset:0; overflow:auto;
  cursor:grab;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.map-scroll.dragging{ cursor:grabbing; }
.map-scroll::-webkit-scrollbar{ width:10px; height:10px; }
.map-scroll::-webkit-scrollbar-thumb{ background:#2b3240; border-radius:999px; border:2px solid #080a0e; }
.map-scroll::-webkit-scrollbar-track{ background:transparent; }

.map-world{ position:relative; }
.terrain{
  position:absolute; left:0; top:0;
  image-rendering:pixelated; image-rendering:crisp-edges;
  display:block;
}
.deco-layer,.nodes-layer{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
.nodes-layer{ pointer-events:none; }

/* vinheta atmosférica sobre o mapa */
.map-vignette{
  position:absolute; inset:0; pointer-events:none; z-index:6;
  box-shadow:inset 0 0 140px 30px rgba(0,0,0,.55);
}

/* ---------- BADGE DA TRILHA ATIVA ---------- */
.trail-badge{
  position:absolute; top:18px; left:18px; z-index:8;
  display:flex; align-items:center; gap:12px;
  padding:10px 16px 10px 12px;
  background:rgba(13,17,23,.82); backdrop-filter:blur(8px);
  border:0.5px solid rgba(240,192,96,.35); border-radius:var(--r-md);
  box-shadow:var(--shadow-soft);
}
.trail-badge .tb-ico{
  width:38px; height:38px; border-radius:9px; display:grid; place-items:center; font-size:21px; color:var(--gold);
  background:linear-gradient(155deg, rgba(240,192,96,.18), rgba(240,192,96,.04));
  border:0.5px solid rgba(240,192,96,.4);
}
.trail-badge .tb-tag{ font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--gold); font-weight:600; }
.trail-badge .tb-name{ font-family:'Cinzel',serif; font-weight:700; font-size:16px; line-height:1.1; }
.trail-badge .tb-name small{ color:var(--text-dim); font-weight:600; font-family:'Inter'; font-size:12px; }

/* ---------- DICA DE CONTROLES ---------- */
.map-hint{
  position:absolute; bottom:16px; left:18px; z-index:8;
  display:flex; align-items:center; gap:8px;
  padding:7px 12px; border-radius:999px;
  background:rgba(13,17,23,.7); backdrop-filter:blur(6px);
  border:var(--hairline); color:var(--text-dim); font-size:12px;
}
.map-hint i{ color:var(--text-mute); }

/* ---------- MINIMAP ---------- */
.minimap{
  position:absolute; right:18px; bottom:18px; z-index:8;
  padding:8px; border-radius:var(--r-md);
  background:rgba(13,17,23,.85); backdrop-filter:blur(8px);
  border:0.5px solid var(--border); box-shadow:var(--shadow-soft);
}
.minimap .mm-title{
  font-family:'Press Start 2P', monospace; font-size:7px; letter-spacing:.5px;
  color:var(--text-mute); margin-bottom:7px; padding-left:2px;
}
.minimap canvas{ display:block; image-rendering:pixelated; border:0.5px solid var(--border); border-radius:4px; cursor:pointer; }

/* ===================================================================
   NÓS DE MISSÃO  (camada HTML interativa)
   =================================================================== */
.node{
  position:absolute; transform:translate(-50%,-50%);
  pointer-events:auto; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  z-index:10;
}
.node .sprite{
  position:relative; width:46px; height:46px;
  display:grid; place-items:center; font-size:26px; line-height:1;
  background:var(--plat,#2c5e38);
  /* moldura pixel — degraus de box-shadow, sem cantos arredondados */
  box-shadow:
    0 0 0 3px #0b0e13,
    0 0 0 6px var(--frame,#39773f),
    0 0 0 7px #0b0e13,
    0 7px 0 7px rgba(0,0,0,.45);
  transition:transform .16s cubic-bezier(.2,.7,.2,1);
  image-rendering:pixelated;
}
.node:hover{ z-index:20; }
.node:hover .sprite{ transform:scale(1.1); }
.node .label{
  font-family:'Press Start 2P', monospace; font-size:8px; line-height:1.4;
  color:var(--text); text-align:center; white-space:nowrap;
  padding:4px 7px; background:rgba(8,10,14,.82);
  border:0.5px solid var(--border); border-radius:4px;
  text-shadow:1px 1px 0 #000;
}

/* estado: CONCLUÍDO — brilho + estrela girando */
.node.done .sprite{ box-shadow:0 0 0 3px #0b0e13,0 0 0 6px var(--frame),0 0 0 7px #0b0e13, 0 0 16px 2px rgba(126,231,135,.45), 0 7px 0 7px rgba(0,0,0,.45); }
.node.done .star{
  position:absolute; top:-12px; right:-12px; font-size:15px; color:var(--gold);
  text-shadow:0 0 6px rgba(240,192,96,.8);
  animation:spin 4s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.node.done .check{
  position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
  width:18px; height:18px; display:grid; place-items:center;
  background:var(--green); color:#0b1f12; font-size:12px; border:2px solid #0b0e13;
}

/* estado: ATIVO — pulso + seta saltitante */
.node.active .sprite{ animation:pulseRing 1.8s ease-in-out infinite; }
@keyframes pulseRing{
  0%,100%{ box-shadow:0 0 0 3px #0b0e13,0 0 0 6px var(--frame),0 0 0 7px #0b0e13, 0 0 0 7px rgba(88,166,255,.0), 0 7px 0 7px rgba(0,0,0,.45); }
  50%{     box-shadow:0 0 0 3px #0b0e13,0 0 0 6px var(--frame),0 0 0 7px #0b0e13, 0 0 0 13px rgba(88,166,255,.22), 0 7px 0 7px rgba(0,0,0,.45); }
}
.node.active .arrow{
  position:absolute; top:-26px; left:50%; transform:translateX(-50%);
  width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent;
  border-top:12px solid var(--blue);
  filter:drop-shadow(0 0 5px rgba(88,166,255,.7));
  animation:bounce 1s ease-in-out infinite;
}
@keyframes bounce{ 0%,100%{ transform:translateX(-50%) translateY(0); } 50%{ transform:translateX(-50%) translateY(7px); } }
.node.active .label{ color:var(--blue); border-color:rgba(88,166,255,.5); }

/* estado: BLOQUEADO — grayscale + cadeado */
.node.locked .sprite{ filter:grayscale(1) brightness(.55); }
.node.locked .label{ color:var(--text-mute); }
.node.locked .lock{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:20px; color:#cfd6df; text-shadow:0 1px 2px #000; background:rgba(8,10,14,.35);
}

/* estado: BOSS — maior, aura vermelha piscando */
.node.boss{ z-index:11; }
.node.boss .sprite{
  width:64px; height:64px; font-size:38px;
  --frame:#e06c75;
  box-shadow:0 0 0 3px #0b0e13,0 0 0 6px var(--frame),0 0 0 7px #0b0e13, 0 8px 0 7px rgba(0,0,0,.5);
  animation:bossAura 1.4s ease-in-out infinite;
  filter:grayscale(.15) brightness(.92);
}
@keyframes bossAura{
  0%,100%{ box-shadow:0 0 0 3px #0b0e13,0 0 0 6px var(--frame),0 0 0 7px #0b0e13, 0 0 12px 2px rgba(224,108,117,.35), 0 8px 0 7px rgba(0,0,0,.5); }
  50%{     box-shadow:0 0 0 3px #0b0e13,0 0 0 6px var(--frame),0 0 0 7px #0b0e13, 0 0 30px 8px rgba(224,108,117,.7), 0 8px 0 7px rgba(0,0,0,.5); }
}
.node.boss .label{ color:var(--red); border-color:rgba(224,108,117,.55); font-size:9px; }
.node.boss .lock{ position:absolute; top:-12px; right:-12px; inset:auto; font-size:16px; color:#cfd6df; background:none; }
.node.boss .crown{ position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:18px; }

/* selecionado */
.node.sel .sprite{ outline:2px solid var(--gold); outline-offset:9px; }

/* ===================================================================
   DECORAÇÕES ANIMADAS  (tochas, bandeiras)
   =================================================================== */
.deco{ position:absolute; transform:translate(-50%,-100%); image-rendering:pixelated; }
/* tocha */
.torch{ width:14px; }
.torch .pole{ width:5px; height:20px; margin:0 auto; background:#6b4a2a; box-shadow:inset -2px 0 0 #4a3119; }
.torch .flame{
  width:12px; height:14px; margin:0 auto -2px;
  background:radial-gradient(circle at 50% 65%, #ffe39b 0%, #f0c060 35%, #e0852f 70%, #c0451f 100%);
  clip-path:polygon(50% 0,78% 35%,90% 70%,72% 100%,28% 100%,10% 70%,22% 35%);
  filter:drop-shadow(0 0 8px rgba(240,160,60,.85));
  animation:torchFlicker .28s steps(2) infinite;
}
@keyframes torchFlicker{
  0%{ transform:scaleY(1) translateX(0); opacity:1; }
  50%{ transform:scaleY(.86) translateX(-.5px); opacity:.85; }
  100%{ transform:scaleY(1.06) translateX(.5px); opacity:1; }
}
/* bandeira (checkpoint concluído) */
.flag{ width:18px; }
.flag .mast{ width:3px; height:26px; margin-left:2px; background:#8a8f98; }
.flag .cloth{
  position:absolute; top:1px; left:4px; width:14px; height:10px; background:var(--green);
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%,4px 50%);
  transform-origin:left center; animation:wave 1.6s ease-in-out infinite;
}
@keyframes wave{ 0%,100%{ transform:skewY(0) scaleX(1); } 50%{ transform:skewY(-6deg) scaleX(.92); } }

/* ===================================================================
   HUD LATERAL DIREITO
   =================================================================== */
.hud{
  flex:0 0 300px; width:300px;
  background:var(--surface); border-left:var(--hairline);
  display:flex; flex-direction:column; min-height:0;
}
.hud-scroll{ overflow-y:auto; padding:22px 20px 24px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.hud-scroll::-webkit-scrollbar{ width:8px; }
.hud-scroll::-webkit-scrollbar-thumb{ background:var(--border); border-radius:999px; }

.hud-head{ display:flex; align-items:center; gap:9px; margin-bottom:18px; }
.hud-head .hh-ico{ color:var(--gold); font-size:18px; }
.hud-head h2{ font-family:'Cinzel',serif; font-weight:600; font-size:16px; letter-spacing:.4px; }

/* preview do sprite + status */
.hud-spritebox{
  display:flex; align-items:center; gap:16px;
  padding:18px; border-radius:var(--r-md);
  background:var(--surface-2); border:var(--hairline); margin-bottom:18px;
}
.hud-sprite{
  width:58px; height:58px; flex-shrink:0; display:grid; place-items:center; font-size:32px;
  background:var(--plat,#2c5e38);
  box-shadow:0 0 0 3px #0b0e13, 0 0 0 6px var(--frame,#39773f), 0 0 0 7px #0b0e13;
  image-rendering:pixelated;
}
.hud-statusline .biome{
  font-family:'Press Start 2P',monospace; font-size:7px; letter-spacing:.5px;
  color:var(--text-mute); text-transform:uppercase; margin-bottom:8px;
}
.status-badge{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700;
  letter-spacing:.4px; text-transform:uppercase;
}
.status-badge.done{ color:var(--green); background:rgba(126,231,135,.1); border:0.5px solid rgba(126,231,135,.35); }
.status-badge.active{ color:var(--blue); background:rgba(88,166,255,.1); border:0.5px solid rgba(88,166,255,.35); }
.status-badge.locked{ color:var(--text-mute); background:var(--surface); border:0.5px solid var(--border); }
.status-badge.boss{ color:var(--red); background:rgba(224,108,117,.1); border:0.5px solid rgba(224,108,117,.35); }

.hud-name{ font-family:'Cinzel',serif; font-weight:700; font-size:23px; line-height:1.15; margin-bottom:8px; }
.hud-desc{ color:var(--text-dim); font-size:13.5px; line-height:1.55; margin-bottom:18px; }

/* recompensa de XP */
.hud-xp{
  display:flex; align-items:center; gap:12px;
  padding:14px 16px; border-radius:var(--r-md);
  background:linear-gradient(155deg, rgba(240,192,96,.12), rgba(240,192,96,.03));
  border:0.5px solid rgba(240,192,96,.3); margin-bottom:18px;
}
.hud-xp .xp-ico{ font-size:22px; color:var(--gold); }
.hud-xp .xp-v{ font-family:'Cinzel',serif; font-weight:700; font-size:22px; color:var(--gold); line-height:1; }
.hud-xp .xp-l{ font-size:11px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.6px; }

/* pré-requisitos */
.hud-prereq{ margin-bottom:20px; }
.hud-prereq .pr-title{
  font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-mute);
  font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:7px;
}
.pr-list{ display:flex; flex-direction:column; gap:8px; }
.pr-row{
  display:flex; align-items:center; gap:10px;
  padding:9px 11px; border-radius:var(--r-sm);
  background:var(--surface-2); border:var(--hairline); font-size:13px;
}
.pr-row .pr-ic{ width:18px; height:18px; display:grid; place-items:center; flex-shrink:0; font-size:13px; }
.pr-row.ok .pr-ic{ color:var(--green); }
.pr-row.no .pr-ic{ color:var(--text-mute); }
.pr-row.no{ color:var(--text-mute); }
.pr-row .pr-name{ flex:1; }
.pr-empty{ font-size:13px; color:var(--text-mute); font-style:italic; padding:4px 2px; }

/* botão de ação */
.btn-gold{
  width:100%; display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:14px 20px; border-radius:var(--r-sm);
  background:linear-gradient(150deg,#f0c060,#d8a945);
  color:#1a1206; font-weight:700; font-size:15px;
  box-shadow:0 6px 18px -8px rgba(240,192,96,.7);
  transition:transform .16s, box-shadow .16s, filter .16s;
}
.btn-gold:hover{ transform:translateY(-2px); box-shadow:0 10px 24px -8px rgba(240,192,96,.8); filter:brightness(1.05); }
.btn-gold:active{ transform:translateY(0); }
.btn-ghost{
  width:100%; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 18px; border-radius:var(--r-sm);
  border:0.5px solid var(--border); background:var(--surface-2);
  color:var(--text); font-weight:600; font-size:14px; transition:border-color .16s, color .16s, transform .16s;
}
.btn-ghost:hover{ border-color:var(--gold); color:var(--gold); transform:translateY(-2px); }
.btn-locked{
  width:100%; display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:14px 20px; border-radius:var(--r-sm);
  border:0.5px solid var(--border); background:var(--surface-2);
  color:var(--text-mute); font-weight:700; font-size:14px; cursor:not-allowed;
}

/* divisor inferior do HUD — progresso da trilha */
.hud-foot{
  margin-top:auto; flex:0 0 auto;
  padding:16px 20px; border-top:var(--hairline); background:var(--bg);
}
.hud-foot .hf-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.hud-foot .hf-lbl{ font-size:12px; color:var(--text-dim); }
.hud-foot .hf-v{ font-family:'Cinzel',serif; font-weight:700; font-size:14px; color:var(--green); }
.hud-foot .bar{ height:8px; border-radius:999px; background:var(--surface-2); border:0.5px solid var(--border); overflow:hidden; }
.hud-foot .bar > span{ display:block; height:100%; background:linear-gradient(90deg,#7ee787,#56b364); border-radius:999px; }

@media (max-width:1100px){
  .hud{ flex-basis:270px; width:270px; }
}
@media (max-width:820px){
  .nav, .user-meta{ display:none; }
}
</style>
</head>
<body>

<!-- ============================ TOPBAR ============================ -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <div class="logo-mark"><i class="ti ti-sword"></i></div>
      <div class="logo-text">Study<b>Quest</b></div>
    </div>
    <nav class="nav">
      <a href="#" class="active"><i class="ti ti-map-2"></i>Mapa</a>
      <a href="#"><i class="ti ti-flask"></i>Lab</a>
      <a href="#"><i class="ti ti-trophy"></i>Conquistas</a>
      <a href="#"><i class="ti ti-chart-bar"></i>Ranking</a>
    </nav>
    <div class="topbar-right">
      <div class="streak-chip" title="Streak atual"><i class="ti ti-flame"></i><span>14</span></div>
      <div class="user-block">
        <div class="user-meta">
          <div class="row1"><span class="name">Davi</span><span class="xp-num">4.820 / 5.500 XP</span></div>
          <div class="xp-mini"><span></span></div>
        </div>

<script>
/* ===================================================================
   CONFIG / GEOMETRIA
   =================================================================== */
const TILE = 8;        // px de arte por tile
const SCALE = 4;       // ampliação CSS (pixel art crisp)
const COLS = 54, ROWS = 38;
const TPX  = TILE * SCALE;            // tamanho do tile em px de tela (32)
const WORLD_W = COLS * TPX, WORLD_H = ROWS * TPX;

/* ---------- PALETAS DE BIOMA (pixel art compatível c/ tema dark) ---------- */
const PAL = {
  grass:    { base:'#2c5e38', hi:'#3a7a45', lo:'#214a2c', ac:'#7ee787' },
  stone:    { base:'#4b515a', hi:'#5c6571', lo:'#3a3f47', ac:'#79828d' },
  forest:   { base:'#1f4a30', hi:'#2a6440', lo:'#163a25', ac:'#3fa05a' },
  mountain: { base:'#544f4b', hi:'#675f59', lo:'#3f3a37', ac:'#8a827b' },
  snow:     { base:'#aab4bf', hi:'#d2dae2', lo:'#828d99', ac:'#ffffff' },
  cave:     { base:'#221b2e', hi:'#2f2643', lo:'#150f1e', ac:'#e06c75' },
  water:    { base:'#1f4e6b', hi:'#2f739a', lo:'#163a52', ac:'#58a6ff' },
  path:     { base:'#a98f60', hi:'#c9b079', lo:'#806842', ac:'#e6d2a3' },
};

/* paleta da moldura/plataforma dos nós por bioma */
const NODE_THEME = {
  grass:    { plat:'#2c5e38', frame:'#3a7a45' },
  stone:    { plat:'#4b515a', frame:'#5c6571' },
  forest:   { plat:'#1f4a30', frame:'#2a6440' },
  mountain: { plat:'#544f4b', frame:'#675f59' },
  cave:     { plat:'#221b2e', frame:'#e06c75' },
};

/* ===================================================================
   NÓS DA TRILHA  (hardcoded — Java & Spring Boot)
   =================================================================== */
const NODES = [
  { id:'oop',     icon:'☕', name:'OOP Java',       biome:'grass',    status:'done',   xp:120,
    tile:[6,31],  desc:'Os pilares da Orientação a Objetos: classes, objetos, herança, polimorfismo e encapsulamento.', prereqs:[] },
  { id:'col',     icon:'🗃️', name:'Collections',    biome:'grass',    status:'done',   xp:140,
    tile:[14,27], desc:'List, Set, Map e Queue — domine as estruturas de dados do Java Collections Framework.', prereqs:['OOP Java'] },
  { id:'streams', icon:'🌊', name:'Streams API',    biome:'grass',    status:'done',   xp:160,
    tile:[9,21],  desc:'Programação funcional com Streams: map, filter, reduce, collectors e lazy evaluation.', prereqs:['Collections'] },
  { id:'maven',   icon:'📦', name:'Maven/Gradle',   biome:'stone',    status:'done',   xp:150,
    tile:[21,26], desc:'Gerenciamento de dependências, ciclo de build e automação com Maven e Gradle.', prereqs:['Collections'] },
  { id:'core',    icon:'🍃', name:'Spring Core',    biome:'forest',   status:'active', xp:220,
    tile:[29,20], desc:'IoC Container, Beans e Injeção de Dependências — o coração do Spring Framework.', prereqs:['Maven/Gradle','Streams API'] },
  { id:'data',    icon:'🗄️', name:'Spring Data',    biome:'forest',   status:'locked', xp:240,
    tile:[37,15], desc:'Repositories, JPA e mapeamento objeto-relacional para persistência transparente.', prereqs:['Spring Core'] },
  { id:'sec',     icon:'🔒', name:'Spring Security',biome:'forest',   status:'locked', xp:260,
    tile:[33,25], desc:'Autenticação, autorização, filtros, JWT e proteção de endpoints REST.', prereqs:['Spring Core'] },
  { id:'docker',  icon:'🐳', name:'Docker',         biome:'mountain', status:'locked', xp:300,
    tile:[43,12], desc:'Containerize sua aplicação Spring Boot e orquestre serviços com Docker Compose.', prereqs:['Spring Data'] },
  { id:'boss',    icon:'🐉', name:'REST API Final', biome:'cave',     status:'boss',   xp:600,
    tile:[48,6],  desc:'DESAFIO FINAL — construa uma API REST completa: segurança, persistência, testes e deploy.', prereqs:['Spring Data','Spring Security','Docker'] },
];

/* arestas (caminhos entre nós) */
const EDGES = [
  ['oop','col'],['col','streams'],['col','maven'],
  ['maven','core'],['streams','core'],
  ['core','data'],['core','sec'],
  ['data','docker'],['sec','docker'],['docker','boss'],
];

const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));

/* ===================================================================
   PRNG DETERMINÍSTICO POR TILE  (para texturas estáveis)
   =================================================================== */
function hash2(x,y){
  let h = (x*73856093) ^ (y*19349663);
  h = (h ^ (h>>>13)) * 1274126177;
  return ((h ^ (h>>>16)) >>> 0) / 4294967295;
}

/* ===================================================================
   GERAÇÃO DE BIOMAS  (Voronoi de zonas + ruído nas bordas + lago)
   =================================================================== */
const ZONES = [
  {b:'grass', c:6, r:31}, {b:'grass', c:14, r:27}, {b:'grass', c:9, r:21}, {b:'grass', c:3, r:34},
  {b:'stone', c:21, r:26}, {b:'stone', c:18, r:31},
  {b:'forest', c:29, r:20}, {b:'forest', c:37, r:15}, {b:'forest', c:33, r:26},
  {b:'mountain', c:43, r:12}, {b:'mountain', c:45, r:19},
  {b:'cave', c:48, r:6}, {b:'cave', c:51, r:11},
];
const LAKE = { c:5, r:16, rad:3.6 };

const biome = [];   // biome[c][r]
for(let c=0;c<COLS;c++){
  biome[c]=[];
  for(let r=0;r<ROWS;r++){
    // lago (override)
    const dl = Math.hypot(c-LAKE.c, r-LAKE.r) + (hash2(c,r)-0.5)*1.6;
    if(dl < LAKE.rad){ biome[c][r]='water'; continue; }
    // Voronoi com jitter nas bordas
    let best=1e9, pick='grass';
    for(const z of ZONES){
      let d = Math.hypot(c-z.c, r-z.r);
      d += (hash2(c*3+z.c, r*3+z.r)-0.5)*5.0;   // ruído orgânico
      if(d<best){ best=d; pick=z.b; }
    }
    // neve nos topos das montanhas
    if(pick==='mountain' && r<=9 && hash2(c,r)>0.25) pick='snow';
    biome[c][r]=pick;
  }
}

/* ===================================================================
   RASTERIZAÇÃO DO CAMINHO  (estrada pixelada entre nós)
   =================================================================== */
const pathSet = new Set();
const key=(c,r)=>c+','+r;
function markPath(a,b){
  const ax=a.tile[0], ay=a.tile[1], bx=b.tile[0], by=b.tile[1];
  const steps = Math.max(Math.abs(bx-ax), Math.abs(by-ay))*4 + 1;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const cx=ax+(bx-ax)*t, cy=ay+(by-ay)*t;
    for(let dc=-1;dc<=1;dc++) for(let dr=-1;dr<=1;dr++){
      const tc=Math.round(cx+dc), tr=Math.round(cy+dr);
      if(tc<0||tr<0||tc>=COLS||tr>=ROWS) continue;
      if(Math.hypot(cx-tc, cy-tr) < 1.15) pathSet.add(key(tc,tr));
    }
  }
}
EDGES.forEach(([a,b])=>markPath(byId[a],byId[b]));

/* ===================================================================
   SPRITES PIXEL  (árvore, pinheiro, rocha) desenhados no canvas
   =================================================================== */
const SPR_TREE = [
  '..FFF..',
  '.FFFFF.',
  'FFFFFFF',
  'FFFFFFF',
  'FFOFFOF',
  '.FFFFF.',
  '..FFF..',
  '...T...',
  '...T...',
];
const SPR_PINE = [
  '...G...',
  '..GGG..',
  '.GGGGG.',
  '...G...',
  '..GGG..',
  '.GGGGG.',
  'GGGGGGG',
  '...T...',
];
const SPR_ROCK = [
  '..RRR..',
  '.RRHHR.',
  'RRRRRRR',
  '.RRRRR.',
];
const SPR_FLOWER = [
  '.A.',
  'AYA',
  '.G.',
];

function drawSprite(ctx, map, px, py, colors){
  for(let r=0;r<map.length;r++){
    for(let c=0;c<map[r].length;c++){
      const ch=map[r][c];
      if(ch==='.'||!colors[ch]) continue;
      ctx.fillStyle=colors[ch];
      ctx.fillRect(px+c, py+r, 1, 1);
    }
  }
}

/* ===================================================================
   RENDER DO TERRENO
   =================================================================== */
const terrain = document.getElementById('terrain');
terrain.width  = COLS*TILE;
terrain.height = ROWS*TILE;
terrain.style.width  = WORLD_W+'px';
terrain.style.height = WORLD_H+'px';
const tctx = terrain.getContext('2d');
tctx.imageSmoothingEnabled=false;

const waterTiles=[]; // p/ animação de cintilância
let decoList=[];     // sprites de decoração

function paintTile(c,r){
  const x=c*TILE, y=r*TILE;
  const isPath = pathSet.has(key(c,r));
  const b = biome[c][r];
  const pal = isPath ? PAL.path : PAL[b];

  // base
  tctx.fillStyle = pal.base;
  tctx.fillRect(x,y,TILE,TILE);

  // textura — pixels de variação determinísticos
  const rng=(i)=>hash2(c*7+i*13, r*7+i*29);
  if(isPath){
    // estrada: pedrinhas claras no centro, bordas escuras
    for(let i=0;i<7;i++){
      const v=rng(i);
      const px=x+((rng(i+40)*TILE)|0), py=y+((rng(i+80)*TILE)|0);
      tctx.fillStyle = v>0.6 ? pal.hi : (v<0.25 ? pal.lo : pal.ac);
      tctx.fillRect(px,py,1,1);
    }
  } else if(b==='water'){
    // água: ondas horizontais (animadas via paintWater)
    paintWaterTile(c,r,0);
    return;
  } else {
    const n = b==='forest'||b==='cave' ? 5 : 6;
    for(let i=0;i<n;i++){
      const v=rng(i);
      const px=x+((rng(i+40)*TILE)|0), py=y+((rng(i+80)*TILE)|0);
      tctx.fillStyle = v>0.66 ? pal.hi : (v<0.30 ? pal.lo : (v>0.6? pal.ac : pal.hi));
      tctx.fillRect(px,py,1,1);
    }
    // detalhes de bioma
    if(b==='cave' && hash2(c+5,r+9)>0.86){ tctx.fillStyle=pal.ac; tctx.fillRect(x+(hash2(c,r)*6|0), y+(hash2(r,c)*6|0),1,1); }
    if(b==='snow'){ tctx.fillStyle=PAL.snow.hi; tctx.fillRect(x+2,y+2,2,1); }
  }
}

function paintWaterTile(c,r,frame){
  const x=c*TILE, y=r*TILE, pal=PAL.water;
  tctx.fillStyle=pal.base; tctx.fillRect(x,y,TILE,TILE);
  for(let yy=0;yy<TILE;yy++){
    for(let xx=0;xx<TILE;xx++){
      const wv = Math.sin((xx + (yy*1.7) + frame*2 + c*3 + r*2) * 0.9);
      if(wv>0.75){ tctx.fillStyle=pal.hi; tctx.fillRect(x+xx,y+yy,1,1); }
      else if(wv<-0.85 && hash2(c+xx,r+yy+frame)>0.7){ tctx.fillStyle=pal.ac; tctx.fillRect(x+xx,y+yy,1,1); }
    }
  }
}

function renderTerrain(){
  // base
  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++) paintTile(c,r);

  // coletar tiles de água p/ animar
  waterTiles.length=0;
  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++) if(biome[c][r]==='water') waterTiles.push([c,r]);

  // decorações (geradas 1x), evitando caminho e nós
  buildDecoList();
  drawDecoSprites();
}

/* sprites de decoração no canvas */
function nearNode(c,r){
  return NODES.some(n=> Math.abs(n.tile[0]-c)<=1 && Math.abs(n.tile[1]-r)<=1);
}
function buildDecoList(){
  decoList=[];
  for(let c=1;c<COLS-1;c++){
    for(let r=1;r<ROWS-1;r++){
      if(pathSet.has(key(c,r)) || nearNode(c,r)) continue;
      const b=biome[c][r], h=hash2(c*11,r*13);
      if(b==='forest' && h>0.55) decoList.push(['tree',c,r]);
      else if(b==='grass' && h>0.9) decoList.push(['tree',c,r]);
      else if(b==='grass' && h>0.78 && h<0.83) decoList.push(['flower',c,r]);
      else if(b==='mountain' && h>0.7) decoList.push(['pine',c,r]);
      else if(b==='snow' && h>0.78) decoList.push(['pine',c,r]);
      else if((b==='stone') && h>0.8) decoList.push(['rock',c,r]);
      else if((b==='cave'||b==='mountain') && h>0.62 && h<0.7) decoList.push(['rock',c,r]);
    }
  }
}
function drawDecoSprites(){
  for(const [type,c,r] of decoList){
    const px=c*TILE, py=r*TILE;
    if(type==='tree'){
      const isGrass = biome[c][r]==='grass';
      drawSprite(tctx, SPR_TREE, px+0, py-2, {
        F:isGrass?'#3a7a45':'#27623b', O:isGrass?'#7ee787':'#3fa05a', T:'#5a3f22'
      });
    } else if(type==='pine'){
      drawSprite(tctx, SPR_PINE, px+0, py-1, { G:biome[c][r]==='snow'?'#3a6b4a':'#2f5a3c', T:'#4a3119' });
    } else if(type==='rock'){
      drawSprite(tctx, SPR_ROCK, px+1, py+1, { R:'#5c6571', H:'#79828d' });
    } else if(type==='flower'){
      const col = hash2(c,r)>0.5 ? '#f0c060' : '#58a6ff';
      drawSprite(tctx, SPR_FLOWER, px+2, py+2, { A:col, Y:'#ffe39b', G:'#3a7a45' });
    }
  }
  // boca de caverna atrás do boss
  const boss=byId['boss'];
  const bx=boss.tile[0]*TILE, by=boss.tile[1]*TILE;
  tctx.fillStyle='#0b0810';
  tctx.fillRect(bx-6,by-2,18,12);
  tctx.fillStyle='#150f1e';
  tctx.fillRect(bx-8,by+8,22,4);
  // pedras da entrada
  drawSprite(tctx, SPR_ROCK, bx-9, by+6, { R:'#2f2643', H:'#3f3454' });
  drawSprite(tctx, SPR_ROCK, bx+9, by+6, { R:'#2f2643', H:'#3f3454' });
}

/* ===================================================================
   CAMADA DE NÓS  (HTML interativo)
   =================================================================== */
const nodesLayer = document.getElementById('nodesLayer');
function centerOf(n){ return { x:(n.tile[0]+0.5)*TPX, y:(n.tile[1]+0.5)*TPX }; }

function buildNodes(){
  NODES.forEach(n=>{
    const {x,y}=centerOf(n);
    const theme = NODE_THEME[n.biome];
    const el=document.createElement('div');
    el.className='node '+n.status;
    el.style.left=x+'px'; el.style.top=y+'px';
    el.dataset.id=n.id;

    let extras='';
    if(n.status==='done') extras='<div class="star">★</div><div class="check"><i class="ti ti-check"></i></div>';
    if(n.status==='active') extras='<div class="arrow"></div>';
    if(n.status==='locked') extras='<div class="lock"><i class="ti ti-lock"></i></div>';
    if(n.status==='boss') extras='<div class="crown">'+ '👑' +'</div><div class="lock"><i class="ti ti-lock"></i></div>';

    el.innerHTML =
      '<div class="sprite" style="--plat:'+theme.plat+';--frame:'+theme.frame+'">'+n.icon+extras+'</div>'+
      '<div class="label">'+n.name+'</div>';
    el.addEventListener('click', ()=> selectNode(n.id));
    nodesLayer.appendChild(el);
  });
}

/* ===================================================================
   DECORAÇÕES ANIMADAS  (tochas + bandeiras em HTML)
   =================================================================== */
const decoLayer = document.getElementById('decoLayer');
const HTML_DECO = [
  // tochas guiando o caminho / entrada da caverna
  {type:'torch', tile:[25,24]}, {type:'torch', tile:[31,17]},
  {type:'torch', tile:[44,9]},  {type:'torch', tile:[46,8]},
  {type:'torch', tile:[39,18]},
  // bandeiras nos checkpoints concluídos
  {type:'flag', tile:[8,30]}, {type:'flag', tile:[19,25]},
];
function buildHtmlDeco(){
  HTML_DECO.forEach(d=>{
    const x=(d.tile[0]+0.5)*TPX, y=(d.tile[1]+0.9)*TPX;
    const el=document.createElement('div');
    el.className='deco '+d.type;
    el.style.left=x+'px'; el.style.top=y+'px';
    if(d.type==='torch') el.innerHTML='<div class="flame"></div><div class="pole"></div>';
    else el.innerHTML='<div style="position:relative"><div class="mast"></div><div class="cloth"></div></div>';
    decoLayer.appendChild(el);
  });
}

/* ===================================================================
   HUD LATERAL  — seleção de nó
   =================================================================== */
const hudScroll = document.getElementById('hudScroll');
const STATUS_LABEL = { done:'Concluído', active:'Em andamento', locked:'Bloqueado', boss:'Boss · Bloqueado' };
const BIOME_LABEL  = { grass:'Bioma · Planície', stone:'Bioma · Pedreira', forest:'Bioma · Floresta', mountain:'Bioma · Montanha', cave:'Bioma · Caverna' };

function prereqStatus(name){
  const p = NODES.find(n=>n.name===name);
  return p && (p.status==='done');
}

function renderHUD(n){
  const theme = NODE_THEME[n.biome];
  const st = n.status==='boss' ? 'boss' : n.status;

  // pré-requisitos
  let prereqHtml;
  if(n.prereqs.length===0){
    prereqHtml = '<div class="pr-empty">Nó inicial — sem pré-requisitos.</div>';
  } else {
    prereqHtml = '<div class="pr-list">'+ n.prereqs.map(p=>{
      const ok=prereqStatus(p);
      return '<div class="pr-row '+(ok?'ok':'no')+'">'+
        '<span class="pr-ic"><i class="ti '+(ok?'ti-circle-check-filled':'ti-lock')+'"></i></span>'+
        '<span class="pr-name">'+p+'</span>'+
        (ok?'<i class="ti ti-check" style="color:var(--green)"></i>':'<span style="font-size:11px;color:var(--text-mute)">pendente</span>')+
        '</div>';
    }).join('')+'</div>';
  }

  // botão de ação
  let action;
  if(n.status==='active') action='<button class="btn-gold"><i class="ti ti-sword"></i>Iniciar Missão</button>';
  else if(n.status==='done') action='<button class="btn-ghost"><i class="ti ti-rotate-clockwise"></i>Revisar Missão</button>';
  else action='<button class="btn-locked"><i class="ti ti-lock"></i>'+(n.status==='boss'?'Derrote os pré-requisitos':'Bloqueado')+'</button>';

  let extras='';
  if(n.status==='done') extras='<div class="check" style="position:static;width:auto;height:auto;background:none;border:none;color:var(--green)"></div>';

  hudScroll.innerHTML =
    '<div class="hud-head"><i class="ti ti-flag-3 hh-ico"></i><h2>Detalhes da Missão</h2></div>'+
    '<div class="hud-spritebox">'+
      '<div class="hud-sprite" style="--plat:'+theme.plat+';--frame:'+theme.frame+'">'+n.icon+'</div>'+
      '<div class="hud-statusline">'+
        '<div class="biome">'+(BIOME_LABEL[n.biome]||'')+'</div>'+
        '<span class="status-badge '+st+'">'+
          (st==='done'?'<i class="ti ti-circle-check-filled"></i>':st==='active'?'<i class="ti ti-player-play-filled"></i>':st==='boss'?'<i class="ti ti-skull"></i>':'<i class="ti ti-lock"></i>')+
          STATUS_LABEL[n.status]+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="hud-name">'+n.name+'</div>'+
    '<div class="hud-desc">'+n.desc+'</div>'+
    '<div class="hud-xp">'+
      '<i class="ti ti-bolt xp-ico"></i>'+
      '<div><div class="xp-v">+'+n.xp+' XP</div><div class="xp-l">Recompensa da missão</div></div>'+
    '</div>'+
    '<div class="hud-prereq">'+
      '<div class="pr-title"><i class="ti ti-list-check"></i>Pré-requisitos</div>'+
      prereqHtml+
    '</div>'+
    action;
}

let selectedId=null;
function selectNode(id){
  selectedId=id;
  document.querySelectorAll('.node').forEach(el=> el.classList.toggle('sel', el.dataset.id===id));
  renderHUD(byId[id]);
  drawMinimap();
}

/* ===================================================================
   MINIMAP
   =================================================================== */
const mm = document.getElementById('minimap');
const mctx = mm.getContext('2d');
const MM_W=120, MM_H=80;
const MM_BIOME = {
  grass:'#2c5e38', stone:'#4b515a', forest:'#1f4a30', mountain:'#544f4b',
  snow:'#aab4bf', cave:'#221b2e', water:'#1f4e6b', path:'#a98f60',
};
function drawMinimap(){
  const sx=MM_W/COLS, sy=MM_H/ROWS;
  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
    const b = pathSet.has(key(c,r)) ? 'path' : biome[c][r];
    mctx.fillStyle = MM_BIOME[b];
    mctx.fillRect(Math.floor(c*sx), Math.floor(r*sy), Math.ceil(sx), Math.ceil(sy));
  }
  // nós
  NODES.forEach(n=>{
    const x=(n.tile[0]+0.5)*sx, y=(n.tile[1]+0.5)*sy;
    mctx.fillStyle = n.status==='active' ? '#58a6ff' : n.status==='boss' ? '#e06c75' : n.status==='done' ? '#7ee787' : '#6e7681';
    mctx.fillRect(Math.round(x-1.5), Math.round(y-1.5), 3, 3);
  });
  // posição atual (nó ativo) — ponto dourado piscante
  const cur = NODES.find(n=>n.status==='active');
  if(cur){
    const x=(cur.tile[0]+0.5)*sx, y=(cur.tile[1]+0.5)*sy;
    mctx.fillStyle='#f0c060';
    mctx.fillRect(Math.round(x-2), Math.round(y-2), 4, 4);
    mctx.strokeStyle='rgba(240,192,96,.6)'; mctx.lineWidth=1;
    mctx.strokeRect(Math.round(x-3.5), Math.round(y-3.5), 7, 7);
  }
  // retângulo do viewport
  const sc=document.getElementById('mapScroll');
  const vx = sc.scrollLeft/WORLD_W*MM_W, vy=sc.scrollTop/WORLD_H*MM_H;
  const vw = sc.clientWidth/WORLD_W*MM_W, vh=sc.clientHeight/WORLD_H*MM_H;
  mctx.strokeStyle='rgba(230,237,243,.85)'; mctx.lineWidth=1;
  mctx.strokeRect(vx+.5, vy+.5, Math.min(vw,MM_W-1), Math.min(vh,MM_H-1));
}
// clique no minimap → centraliza
mm.addEventListener('click', e=>{
  const rect=mm.getBoundingClientRect();
  const fx=(e.clientX-rect.left)/MM_W, fy=(e.clientY-rect.top)/MM_H;
  const sc=document.getElementById('mapScroll');
  sc.scrollTo({ left:fx*WORLD_W - sc.clientWidth/2, top:fy*WORLD_H - sc.clientHeight/2, behavior:'smooth' });
});

/* ===================================================================
   DRAG-TO-PAN + SCROLL
   =================================================================== */
const scroll = document.getElementById('mapScroll');
let dragging=false, moved=false, sx0=0, sy0=0, sl0=0, st0=0;
scroll.addEventListener('pointerdown', e=>{
  if(e.target.closest('.node')) return;       // não arrastar ao clicar num nó
  dragging=true; moved=false;
  sx0=e.clientX; sy0=e.clientY; sl0=scroll.scrollLeft; st0=scroll.scrollTop;
  scroll.classList.add('dragging'); scroll.setPointerCapture(e.pointerId);
});
scroll.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-sx0, dy=e.clientY-sy0;
  if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
  scroll.scrollLeft=sl0-dx; scroll.scrollTop=st0-dy;
});
function endDrag(e){ if(!dragging) return; dragging=false; scroll.classList.remove('dragging'); }
scroll.addEventListener('pointerup', endDrag);
scroll.addEventListener('pointercancel', endDrag);
scroll.addEventListener('scroll', ()=>{ requestAnimationFrame(drawMinimap); });

/* ===================================================================
   ANIMAÇÃO DA ÁGUA  (2 frames alternados)
   =================================================================== */
let wframe=0;
function animateWater(){
  wframe=(wframe+1)%4;
  for(const [c,r] of waterTiles) paintWaterTile(c,r,wframe);
}

/* ===================================================================
   INIT
   =================================================================== */
function init(){
  document.getElementById('mapWorld').style.width=WORLD_W+'px';
  document.getElementById('mapWorld').style.height=WORLD_H+'px';

  renderTerrain();
  buildNodes();
  buildHtmlDeco();
  drawMinimap();

  // seleciona o nó ativo e centraliza nele (após layout estabilizar)
  const active = NODES.find(n=>n.status==='active');
  selectNode(active.id);
  function centerOnActive(){
    const ctr=centerOf(active);
    scroll.scrollLeft = ctr.x - scroll.clientWidth/2;
    scroll.scrollTop  = ctr.y - scroll.clientHeight/2;
    drawMinimap();
  }
  requestAnimationFrame(()=>requestAnimationFrame(centerOnActive));
  window.addEventListener('load', centerOnActive);

  setInterval(animateWater, 320);
  window.addEventListener('resize', drawMinimap);
}
init();
</script>
